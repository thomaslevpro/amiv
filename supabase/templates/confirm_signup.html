<div style="margin:0;padding:32px 16px;background:#F2F2F7;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;">
  <div style="max-width:480px;margin:0 auto;padding:40px 32px;background:#ffffff;border-radius:20px;text-align:center;">
    <div style="font-size:32px;font-weight:800;line-height:1;color:#e055aa;margin-bottom:28px;">Amiv</div>
    <h1 style="margin:0 0 14px;color:#1C1C1E;font-size:22px;font-weight:700;line-height:1.25;">Bienvenue sur Amiv !</h1>
    <p style="margin:0;color:#8E8E93;font-size:15px;line-height:1.6;">Voici ton code pour confirmer ton adresse email. Saisis-le dans l'app pour finir ton inscription.</p>
    <div style="margin:28px 0;padding:20px 12px;background:#FFF0F7;border-radius:16px;">
      <div style="font-size:38px;font-weight:800;letter-spacing:10px;color:#1C1C1E;font-family:'SF Mono',Menlo,Consolas,monospace;">{{ .Token }}</div>
    </div>
    <p style="margin:0 0 8px;color:#8E8E93;font-size:13px;line-height:1.5;">Ce code est valable 1 heure.</p>
    <p style="margin:0;color:#AEAEB2;font-size:12px;line-height:1.5;">Tu n'as pas créé de compte Amiv ? Ignore simplement cet email.</p>
  </div>
</div>
